<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2534" />
      <stop offset="100%" stop-color="#0D131C" />
    </linearGradient>
    <linearGradient id="facetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E3BE" />
      <stop offset="100%" stop-color="#D4AF6A" />
    </linearGradient>
    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C9A86A" />
      <stop offset="100%" stop-color="#8A7548" />
    </linearGradient>
    <linearGradient id="facetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B4934F" />
      <stop offset="100%" stop-color="#6B5A38" />
    </linearGradient>
  </defs>

  <!-- Fond arrondi style icône d'app -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Nid d'abeille en filigrane -->
  <g opacity="0.10" stroke="#E7CC93" stroke-width="3" fill="none">
    <polygon points="150,90 220,130 220,210 150,250 80,210 80,130" />
    <polygon points="290,90 360,130 360,210 290,250 220,210 220,130" />
    <polygon points="150,250 220,290 220,370 150,410 80,370 80,290" />
    <polygon points="290,250 360,290 360,370 290,410 220,370 220,290" />
    <polygon points="430,130 430,210 360,250" />
  </g>

  <!-- Logo "T" facetté (bas-relief géométrique à 3 plans) -->
  <g>
    <polygon points="176,150 336,150 336,222 288,222 288,392 224,392 224,222 176,222" fill="url(#facetTop)" />
    <polygon points="176,150 224,222 224,392 176,352" fill="url(#facetLeft)" />
    <polygon points="336,150 288,222 288,392 336,352" fill="url(#facetRight)" />
  </g>
</svg>
